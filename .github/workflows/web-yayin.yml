# Web sürümünü derleyip FTP ile dkproject.tr/tiklaatan klasörüne yükler.
# Çalışma: ana dala (main/master) push edilince ya da Actions sekmesinden elle.
# Gerekli GitHub Secrets: FTP_SERVER, FTP_USER, FTP_PASSWORD, FTP_DIR
# İsteğe bağlı Secrets (derlemeye gömülür): EXPO_PUBLIC_API_URL, EXPO_PUBLIC_GROQ_API_KEY, EXPO_PUBLIC_GEMINI_API_KEY
name: Web yayını (FTP)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  yayinla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Web derlemesi
        run: npx expo export --platform web
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_GROQ_API_KEY: ${{ secrets.EXPO_PUBLIC_GROQ_API_KEY }}
          EXPO_PUBLIC_GEMINI_API_KEY: ${{ secrets.EXPO_PUBLIC_GEMINI_API_KEY }}

      # FTP başarısız olsa bile derlenmiş site buradan indirilip elle yüklenebilir.
      - name: Derlenmiş siteyi sakla
        uses: actions/upload-artifact@v4
        with:
          name: tiklaatan-web
          path: dist/
          retention-days: 14

      # lftp: bağlantı kesilirse kendiliğinden yeniden bağlanıp kaldığı yerden devam eder.
      - name: FTP ile yükle (lftp)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          sudo apt-get install -y lftp >/dev/null
          lftp -u "$FTP_USER","$FTP_PASSWORD" "ftp://$FTP_SERVER" -e "
            set ftp:ssl-force true
            set ftp:ssl-protect-data true
            set ssl:verify-certificate no
            set net:max-retries 30
            set net:reconnect-interval-base 4
            set net:timeout 20
            mkdir -p \"$FTP_DIR\"
            mirror -R --verbose --parallel=1 --no-perms dist/ \"$FTP_DIR\"
            bye
          "
